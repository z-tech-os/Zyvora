<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zyvora Assistant AI</title>
  <link rel="stylesheet" href="zyvora-ai.css">
  <link
  href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;300;400;500;600;700;800;900&display=swap"
  rel="stylesheet"
>
<!-- =========================
     FONT AWESOME
     ========================= -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>
</head>


<body>

  <div class="app">
    <!-- ============== HEADER ================ -->
    <header class="header">

      <div class="brand">

        <div class="logo">Z</div>

        <div>
          <h1>Zyvora AI</h1>
          <p>Your smart digital assistant</p>
        </div>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        Online
      </div>
    </header>


    <!-- ============= CHAT AREA ================ -->

    <main id="chat-box" class="chat-box">

      <!-- First AI message -->
      <div class="message bot-message">

        <div class="avatar bot-avatar">Z</div>

        <div class="bubble">
Heyy Bestie! I'm Zyvora AI. I'm here to help with Zyvora, coding, learning, technology, and more or do you have anything else in mind?

How can I help you today?

        </div>
      </div>
    </main>


    <!-- ============INPUT AREA ================ -->
    <footer class="input-area">

      <input
        id="user-input"
        type="text"
        placeholder="Ask Zyvora AI..."
        autocomplete="off"
      >

      <button id="send-btn" type="button"> ➤</button>

    </footer>

  </div>
  <script src="zyvora-ai.js"></script>

</body>
</html>
